name: Build PCin4Server EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/build-server.yml'
  workflow_dispatch:

jobs:
  build-windows-server:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pyinstaller

      - name: Build PCin4Server.exe
        working-directory: server
        run: |
          pyinstaller --noconfirm --onefile --console --name "PCin4Server" `
            --hidden-import "database" `
            --hidden-import "hot_deploy" `
            --hidden-import "uvicorn.logging" `
            --hidden-import "uvicorn.loops" `
            --hidden-import "uvicorn.loops.auto" `
            --hidden-import "uvicorn.protocols" `
            --hidden-import "uvicorn.protocols.http" `
            --hidden-import "uvicorn.protocols.http.auto" `
            --hidden-import "uvicorn.lifespan" `
            --hidden-import "uvicorn.lifespan.on" `
            --distpath "dist" `
            --workpath "build" `
            main.py

      - name: Upload PCin4Server.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCin4Server-exe
          path: server/dist/PCin4Server.exe
          if-no-files-found: error
